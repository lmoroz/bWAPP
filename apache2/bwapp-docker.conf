# Apache settings the labs expect from the bee-box config (apache2/default), for the Docker image

<Directory /var/www/html/>
	# ssii.php: Server-Side Includes injection needs Includes
	Options Indexes FollowSymLinks Includes
	# restrict_folder_access.php: medium and high levels protect documents/ with .htaccess
	AllowOverride All
</Directory>

AddType text/html .shtml
AddOutputFilter INCLUDES .shtml
