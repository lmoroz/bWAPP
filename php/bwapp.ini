; Keep PHP 7.4 default error reporting: bWAPP is legacy code, and PHP 8
; deprecations leak into responses (breaks the SOAP WSDL output, for example)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; CVE-2026-115560 (php.net advisory 2026-10-23): not fixed in 8.4.27 yet
session.upload_progress.enabled = 0
